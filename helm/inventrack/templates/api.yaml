apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "it.api" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
    {{- include "it.selector" (list . "api") | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "it.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "it.selector" (list . "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: {{ include "it.image" (list .Values.api.image .) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # Schema migrations run in the hook Job, so the pods only serve
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "it.fullname" . }}-config
          env: {{- include "it.dbEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "it.securityContext" true | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "it.api" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
    {{- include "it.selector" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "it.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
