apiVersion: v1
kind: Service
metadata:
  name: {{ include "it.db" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
    {{- include "it.selector" (list . "db") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "it.selector" (list . "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "it.db" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
    {{- include "it.selector" (list . "db") | nindent 4 }}
spec:
  serviceName: {{ include "it.db" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "it.selector" (list . "db") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "it.selector" (list . "db") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70       # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "it.dbSecret" . }}
                  key: {{ .Values.database.secretKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.database.user }}", "-d", "{{ .Values.database.name }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.database.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
