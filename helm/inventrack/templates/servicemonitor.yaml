{{- if .Values.metrics.serviceMonitor.enabled }}
# Picked up by the Prometheus Operator (kube-prometheus-stack): scrape /metrics on every API pod
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "it.api" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels: {{- include "it.selector" (list . "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
