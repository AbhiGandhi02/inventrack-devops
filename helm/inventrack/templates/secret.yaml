{{- if not .Values.database.existingSecret }}
{{- /* Reuse the password already in the cluster so upgrades never change it */}}
{{- $name := include "it.dbSecret" . }}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.database.password }}
{{- if and (not $password) $current }}
{{- $password = index $current.data .Values.database.secretKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "it.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.database.secretKey }}: {{ default (randAlphaNum 24) $password | b64enc | quote }}
{{- end }}
