# Used by Argo CD (gitops/argocd-application.yaml) on top of values.yaml.
# The CI job "gitops-bump" rewrites both tags with the commit SHA it just built and pushed.
api:
  image:
    tag: "9ed2011b31daaddd7bdd0c44fe81d4644ba7b9a8"
web:
  image:
    tag: "9ed2011b31daaddd7bdd0c44fe81d4644ba7b9a8"

database:
  # Argo CD renders without cluster access, so the chart cannot generate and keep a password.
  # Create this Secret once before the first sync (see gitops/README.md).
  existingSecret: inventrack-db

metrics:
  serviceMonitor:
    enabled: true
