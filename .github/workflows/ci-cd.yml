name: InvenTrack CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/inventrack/values-gitops.yaml" # committed by the gitops-bump job below
      - "**.md"
      - "screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND: application/backend
  FRONTEND: application/frontend
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ===================================================================== build & test
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (any failure stops the pipeline)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend-build:
    name: Frontend · vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND }}/dist
          retention-days: 3

  iac-lint:
    name: IaC · helm lint + terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint (local and GitOps values)
        run: |
          helm lint helm/inventrack -f helm/inventrack/values-local.yaml
          helm lint helm/inventrack -f helm/inventrack/values-gitops.yaml
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt + validate (no cloud credentials needed)
        run: |
          for dir in terraform terraform/local; do
            terraform -chdir=$dir fmt -check -recursive
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  # ===================================================================== DevSecOps
  sast:
    name: SAST · Bandit + CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bandit (fail on medium+ severity)
        run: pip install bandit && bandit -r ${{ env.BACKEND }}/app -ll
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
          source-root: application
      - uses: github/codeql-action/analyze@v4

  sca:
    name: SCA · pip-audit + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r ${{ env.BACKEND }}/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (fail on high/critical)
        working-directory: ${{ env.FRONTEND }}
        run: npm audit --audit-level=high

  secrets:
    name: Secrets · Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan the working tree for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --verbose --exit-code 1

  # ===================================================================== images
  build-images:
    name: Build image · ${{ matrix.component }}
    needs: [backend-tests, frontend-build, iac-lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: docker build (tag = commit SHA, never latest)
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t inventrack-${{ matrix.component }}:${{ github.sha }} application/${{ matrix.component }}
      - name: Save the image so every later job uses these exact bytes
        run: docker save inventrack-${{ matrix.component }}:${{ github.sha }} -o ${{ runner.temp }}/${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar
          retention-days: 1

  scan-images:
    name: Trivy · ${{ matrix.component }}
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}
      - name: Fail on fixable HIGH / CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/${{ matrix.component }}.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  security-gate:
    name: Security gate
    needs: [backend-tests, frontend-build, iac-lint, sast, sca, secrets, scan-images]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests, IaC lint, SAST, SCA, secret scan and image scans passed - images may be published."

  # ===================================================================== delivery
  publish:
    name: Push to GHCR · ${{ matrix.component }}
    needs: security-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag with the commit SHA and push
        run: |
          IMAGE="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')/inventrack-${{ matrix.component }}:${{ github.sha }}"
          docker load -i ${{ runner.temp }}/${{ matrix.component }}.tar
          docker tag inventrack-${{ matrix.component }}:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "### Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: Deploy to kind + smoke test
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: inventrack-ci
      - name: Load the pipeline's images into the cluster
        run: |
          for c in backend frontend; do
            docker load -i ${{ runner.temp }}/$c.tar
            kind load docker-image inventrack-$c:${{ github.sha }} --name inventrack-ci
          done
      - name: helm upgrade --install
        run: |
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install inventrack helm/inventrack -n inventrack \
            --set api.image.repository=inventrack-backend --set api.image.tag=${{ github.sha }} \
            --set web.image.repository=inventrack-frontend --set web.image.tag=${{ github.sha }} \
            --set ingress.enabled=false --wait --timeout 5m
          kubectl get pods,svc -n inventrack
      - name: Smoke test through the frontend service
        run: |
          kubectl port-forward -n inventrack svc/inventrack-web 8081:80 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:8081/healthz && break; sleep 1; done
          curl -sf localhost:8081/api/summary
          curl -sf -X POST localhost:8081/api/items -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke item","sku":"CI-SMOKE","quantity":3,"unit_price":1}'
          curl -sf localhost:8081/api/items?search=CI-SMOKE | grep -q CI-SMOKE
          echo "Smoke test passed"
      - name: Diagnostics on failure
        if: failure()
        run: kubectl describe pods -n inventrack; kubectl logs -n inventrack -l app.kubernetes.io/component=api --tail=50

  gitops-bump:
    name: GitOps · bump image tags
    needs: deploy-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Write the new SHA into values-gitops.yaml (Argo CD deploys it)
        run: |
          FILE=helm/inventrack/values-gitops.yaml
          sed -i -E "s/^(\s+tag:).*/\1 \"${{ github.sha }}\"/" "$FILE"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gitops: deploy inventrack ${GITHUB_SHA::7}" || { echo "nothing to change"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
