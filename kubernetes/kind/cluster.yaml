# Local Kubernetes cluster for InvenTrack: 1 control plane + 2 workers.
#   kind create cluster --config kubernetes/kind/cluster.yaml
# Host port 8080 -> ingress-nginx (HTTP), so http://inventrack.local:8080 reaches the Ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inventrack
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
