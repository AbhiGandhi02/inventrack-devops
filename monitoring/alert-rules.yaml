# InvenTrack alerts, loaded by the Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventrack-alerts
  namespace: monitoring
spec:
  groups:
    - name: inventrack.availability
      rules:
        - alert: InventrackApiDown
          expr: absent(up{namespace="inventrack", service="inventrack-api"} == 1)
          for: 1m
          labels: { severity: critical, team: inventrack }
          annotations:
            summary: No InvenTrack API pod is being scraped successfully
            runbook: kubectl get pods -n inventrack; kubectl describe deploy inventrack-api -n inventrack
        - alert: InventrackApiReplicasDegraded
          expr: kube_deployment_status_replicas_available{namespace="inventrack", deployment="inventrack-api"} < 2
          for: 3m
          labels: { severity: warning, team: inventrack }
          annotations:
            summary: Fewer than 2 InvenTrack API replicas are available
        - alert: InventrackPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="inventrack"}[10m]) > 2
          labels: { severity: warning, team: inventrack }
          annotations:
            summary: "{{ $labels.pod }} restarted more than twice in 10 minutes"
    - name: inventrack.performance
      rules:
        - alert: InventrackHigh5xxRate
          expr: |
            sum(rate(http_requests_total{namespace="inventrack", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="inventrack"}[5m])), 1e-9) > 0.05
          for: 2m
          labels: { severity: warning, team: inventrack }
          annotations:
            summary: More than 5% of InvenTrack API responses are 5xx
        - alert: InventrackSlowResponses
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="inventrack", handler=~"/api/.*"}[5m]))) > 0.75
          for: 5m
          labels: { severity: warning, team: inventrack }
          annotations:
            summary: InvenTrack API p95 latency is above 750 ms
        - alert: InventrackApiAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="inventrack"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="inventrack"}
          for: 10m
          labels: { severity: info, team: inventrack }
          annotations:
            summary: The API autoscaler has been at its maximum for 10 minutes
